name: Update videos.json
on:
  push:
    branches: [main]
    paths:
      - 'videa/*.mp4'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate videos.json
        run: |
          python3 -c "
          import json, glob
          files = sorted(glob.glob('videa/*.mp4'))
          with open('videos.json', 'w') as f:
              json.dump(files, f)
          "
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add videos.json
          git diff --staged --quiet || (git commit -m "Auto-update videos.json" && git push)
